{% extends 'base.html' %}
{% block title %}Register – City General Hospital{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo">🏥</div>
            <h2>Create Account</h2>
            <p>Join the City General Hospital portal</p>
        </div>
        <form method="POST" action="{{ url_for('auth.register') }}" novalidate>
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Your full name" required autofocus>
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="your@email.com" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-with-toggle">
                    <input type="password" id="password" name="password" placeholder="Min 6 characters" required>
                    <button type="button" class="toggle-pw" onclick="togglePassword('password', this)">👁</button>
                </div>
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <div class="input-with-toggle">
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="Repeat password" required>
                    <button type="button" class="toggle-pw" onclick="togglePassword('confirm_password', this)">👁</button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Create Account</button>
        </form>
        <div class="auth-footer">
            <p>Already have an account? <a href="{{ url_for('auth.login') }}">Sign in here</a></p>
        </div>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script>
function togglePassword(id, btn) {
    const input = document.getElementById(id);
    input.type = input.type === 'password' ? 'text' : 'password';
    btn.textContent = input.type === 'password' ? '👁' : '🙈';
}
</script>
{% endblock %}
